name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B -ntp verify
      - name: Publish the JAR with its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target
          sha256sum file-organizer.jar > file-organizer.jar.sha256
          gh release create "$GITHUB_REF_NAME" file-organizer.jar file-organizer.jar.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
